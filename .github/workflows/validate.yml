name: Validate workstation package
on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Check PowerShell source syntax
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Path core,installer -Filter '*.ps1' -Recurse -ErrorAction SilentlyContinue)
          $harness = Get-Item -LiteralPath 'scripts/Invoke-VmInstallTest.ps1'
          $files += $harness
          $files += (Get-Item -LiteralPath 'scripts/Test-WorkflowPowerShell.ps1')
          if ($files.Count -eq 0) { throw 'No PowerShell files found' }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName,[ref]$tokens,[ref]$errors)
            if ($errors.Count) {
              foreach ($problem in $errors) { Write-Error "$($file.FullName): $($problem.Message)" }
              throw "Syntax validation failed in $($file.Name)"
            }
          }
      - name: Check brand profile JSON
        shell: pwsh
        run: |
          $profiles = @(Get-ChildItem brands -Filter profile.json -Recurse)
          if ($profiles.Count -lt 9) { throw 'Expected nine manufacturer profiles' }
          foreach ($file in $profiles) {
            $profile = Get-Content $file.FullName -Raw | ConvertFrom-Json
            if (-not $profile.id -or -not $profile.displayName) { throw "Invalid profile: $($file.FullName)" }
          }
      - name: Check release safety boundaries
        shell: pwsh
        run: |
          $protected = @('apps.json','device.json','secrets.json')
          foreach ($name in $protected) {
            if (Get-ChildItem -Path core,installer,brands -Filter $name -Recurse -ErrorAction SilentlyContinue) {
              throw "Protected local config found in release source: $name"
            }
          }
          Write-Host 'Source checks passed. Runtime/UI testing still required.'
      - name: Parse inline workflow PowerShell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File scripts/Test-WorkflowPowerShell.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  catalog-line-endings:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Force autocrlf before checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf true
      - uses: actions/checkout@v4
      - name: Assert catalog.json matches catalog.sha256
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $autocrlf = [string](git config --global --get core.autocrlf)
          if ($autocrlf -ne 'true') { throw "core.autocrlf is '$autocrlf'" }
          $pinText = [System.IO.File]::ReadAllText((Join-Path (Get-Location) 'catalog\catalog.sha256'))
          $pin = (($pinText.Trim()) -split '\s+')[0].ToLowerInvariant()
          $hash = (Get-FileHash -LiteralPath 'catalog\catalog.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $pin) { throw "catalog.json SHA-256 $hash does not match catalog.sha256 $pin" }
          Write-Output "PASS catalog.json $hash matches catalog.sha256 under autocrlf=true"
          $paths = @(
            'catalog/catalog.json',
            'catalog/catalog.sha256',
            'catalog/catalog.json.release.sig',
            'releases/versions.lock.json',
            'tools/security/wub/tool-manifest.json',
            'tools/security/wub/Wub_x64.exe',
            'tools/security/wub/Wub.exe',
            'tools/security/wub/Wub.ini',
            'tools/security/wub/UPSTREAM-README.md'
          )
          foreach ($rel in $paths) {
            $spec = 'HEAD:' + $rel
            $blob = ([string](git rev-parse $spec)).Trim()
            $work = ([string](git hash-object -- $rel)).Trim()
            if ($work -ne $blob) { throw "$rel working tree $work does not match blob $blob" }
            Write-Output "PASS $rel matches blob $blob"
          }

  workstation-manager:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Compile WorkstationManager.exe twice and scan its logos
        shell: pwsh
        run: |
          Push-Location manager
          go test -count=1 .
          if ($LASTEXITCODE -ne 0) { throw 'manager brand guard tests failed' }
          Pop-Location
          $out = Join-Path $env:RUNNER_TEMP 'WorkstationManager.exe'
          python scripts/build-workstation-manager.py mercedes $out --verify-reproducible
          if ($LASTEXITCODE -ne 0) { throw 'WorkstationManager build failed' }
          $env:WORKSTATION_MANAGER_EXE = $out
          pwsh -NoProfile -File scripts/Test-WorkstationManagerLogo.ps1

  master-installer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        shell: bash
        run: git fetch --depth=1 origin "${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Install PowerShell
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pwsh.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.4.12/powershell-7.4.12-linux-x64.tar.gz
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf /tmp/pwsh.tar.gz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          echo "$RUNNER_TEMP/pwsh" >> "$GITHUB_PATH"
      - name: Test master installer
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -File scripts/Test-MasterInstaller.ps1
          pwsh -NoProfile -File scripts/Test-MercedesUpdater.ps1
          pwsh -NoProfile -File scripts/Test-BmwBundle.ps1
          pwsh -NoProfile -File scripts/Test-WorkstationManagerLogo.ps1
          (cd manager && go test -count=1 .)
