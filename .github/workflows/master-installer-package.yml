name: Package master installer

# Builds DiagnosticWorkstation-Setup.zip. Does not create a release, push a tag, or publish assets.
# PS2EXE output is not byte-reproducible. The CI artifact hash is the attested value.
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PS2EXE_VERSION: '1.0.18'
      PS2EXE_NUPKG_SHA256: '692124163d0e71262d76e2f2b2588e1661df28a8f0cf3b1725e47a957afce39f'
    steps:
      - uses: actions/checkout@v4
      - name: Build DiagnosticWorkstation-Setup.zip
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          Write-Output ("PS2EXE pin " + $env:PS2EXE_VERSION + " " + $env:PS2EXE_NUPKG_SHA256)
          & .\scripts\Build-MasterInstallerPackage.ps1
          $zip = Join-Path (Get-Location) 'dist\DiagnosticWorkstation-Setup.zip'
          $side = $zip + '.sha256'
          if (-not (Test-Path -LiteralPath $zip)) { throw 'DiagnosticWorkstation-Setup.zip was not written' }
          if (-not (Test-Path -LiteralPath $side)) { throw 'DiagnosticWorkstation-Setup.zip.sha256 was not written' }
          $note = 'PS2EXE output is not byte-reproducible. The CI artifact hash is the attested value.'
          Write-Output $note
          $sideText = [System.IO.File]::ReadAllText($side).Trim()
          Write-Output $sideText
          if (-not [string]::IsNullOrWhiteSpace($env:GITHUB_STEP_SUMMARY)) {
            $utf8 = New-Object System.Text.UTF8Encoding $false
            [System.IO.File]::AppendAllText($env:GITHUB_STEP_SUMMARY, ($note + "`n" + $sideText + "`n"), $utf8)
          }
          Write-Output 'Package build finished'
      - name: Verify the package and run Setup.exe in report mode
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $zip = Join-Path (Get-Location) 'dist\DiagnosticWorkstation-Setup.zip'
          & .\scripts\Test-MasterInstallerPackage.ps1 -ZipPath $zip
      - name: Upload the setup package
        uses: actions/upload-artifact@v4
        with:
          name: DiagnosticWorkstation-Setup
          path: |
            dist/DiagnosticWorkstation-Setup.zip
            dist/DiagnosticWorkstation-Setup.zip.sha256
          if-no-files-found: error
