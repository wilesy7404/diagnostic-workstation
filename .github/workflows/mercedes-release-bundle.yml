name: Build Mercedes release bundle

# Manual bundle only. This workflow does not create a release, push a tag, or publish assets.
# The version input is passed through. A later version does not require editing a guard.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Mercedes version without the tag prefix'
        required: true
        default: '0.1.3-beta.4'
        type: string

permissions:
  contents: read
  actions: write

jobs:
  manager:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.2'
      - name: Compile WorkstationManager.exe from source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Push-Location manager
          go test -count=1 .
          if ($LASTEXITCODE -ne 0) { throw 'manager brand guard tests failed' }
          Pop-Location
          python scripts/build-workstation-manager.py mercedes dist/WorkstationManager.exe --verify-reproducible
          if ($LASTEXITCODE -ne 0) { throw 'WorkstationManager build failed' }
      - name: Scan the exe for other brand logos
        shell: pwsh
        run: |
          $env:WORKSTATION_MANAGER_EXE = Join-Path (Get-Location) 'dist/WorkstationManager.exe'
          pwsh -NoProfile -File scripts/Test-WorkstationManagerLogo.ps1
      - name: Upload compiled WorkstationManager.exe
        uses: actions/upload-artifact@v4
        with:
          name: workstation-manager-exe
          path: dist/WorkstationManager.exe
          if-no-files-found: error

  bundle:
    needs: manager
    runs-on: ubuntu-latest
    env:
      WORKSTATION_MANAGER_EXE: ${{ github.workspace }}/dist/WorkstationManager.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: workstation-manager-exe
          path: dist
      - name: Check Mercedes updater scripts
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/pwsh.tar.gz https://github.com/PowerShell/PowerShell/releases/download/v7.4.12/powershell-7.4.12-linux-x64.tar.gz
          mkdir -p "$RUNNER_TEMP/pwsh"
          tar -xzf /tmp/pwsh.tar.gz -C "$RUNNER_TEMP/pwsh"
          chmod +x "$RUNNER_TEMP/pwsh/pwsh"
          "$RUNNER_TEMP/pwsh/pwsh" -NoProfile -File scripts/Test-MercedesUpdater.ps1
          "$RUNNER_TEMP/pwsh/pwsh" -NoProfile -File scripts/Test-WorkstationManagerLogo.ps1
      - name: Build workstation.zip and update-manifest.json
        shell: bash
        env:
          BUNDLE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/build-mercedes-bundle.py "$BUNDLE_VERSION"
          test -f "dist/mercedes-v${BUNDLE_VERSION}/workstation.zip"
          test -f "dist/mercedes-v${BUNDLE_VERSION}/update-manifest.json"
          echo "Bundle is an Actions artifact only. No GitHub Release was created."
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mercedes-v${{ inputs.version }}
          path: |
            dist/mercedes-v${{ inputs.version }}/workstation.zip
            dist/mercedes-v${{ inputs.version }}/update-manifest.json
          if-no-files-found: error
