name: VM install test

# Manual install test only. This workflow does not create a release, push a tag, or publish assets.
# The catalog comes from catalog_ref. The harness script comes from the workflow commit,
# so a catalog branch that does not yet contain this file can still be tested.
# Checkout disables autocrlf and then checks catalog.json against catalog.sha256.
# Downgrade is NOT RUN unless an older approved pin has offline/<tag>/ staged.
on:
  workflow_dispatch:
    inputs:
      mercedes_run_id:
        description: 'Actions run id for the Mercedes bundle artifact. Required when the catalog pins a Mercedes release. main pins mercedes-v0.1.3-beta.4; use 39091982618.'
        required: false
        default: ''
        type: string
      bmw_run_id:
        description: 'Actions run id for the BMW bundle artifact'
        required: true
        default: '39087426283'
        type: string
      catalog_ref:
        description: 'Git ref whose catalog/catalog.json is used'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read
  actions: read

jobs:
  vm-install-test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Keep checkout bytes identical to the git blob
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          git config --global core.autocrlf false

      - name: Check out catalog ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.catalog_ref }}
          persist-credentials: false

      - name: Check out the VM harness from this workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: vm-harness
          persist-credentials: false

      - name: Verify the catalog pin survived checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $pinText = [System.IO.File]::ReadAllText('catalog\catalog.sha256')
          $pin = (($pinText.Trim()) -split '\s+')[0].ToLowerInvariant()
          $hash = (Get-FileHash -LiteralPath 'catalog\catalog.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne $pin) { throw "catalog.json $hash does not match catalog.sha256 $pin" }
          Write-Output "PASS catalog pin $hash"

      - name: Parse workflow scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-ChildItem -Path 'installer\Master' -Filter '*.ps1' -Recurse | ForEach-Object { $_.FullName })
          $files += (Join-Path (Get-Location) 'vm-harness\scripts\Invoke-VmInstallTest.ps1')
          if ($files.Count -lt 2) { throw 'Installer or harness script is missing' }
          foreach ($file in $files) {
            if (-not (Test-Path -LiteralPath $file)) { throw "Missing $file" }
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              foreach ($problem in @($errors)) { Write-Error "$file : $($problem.Message)" }
              throw "Syntax validation failed: $file"
            }
            Write-Output "PASS parse $file"
          }

      - name: Download bundle artifacts
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          MERCEDES_RUN_ID: ${{ inputs.mercedes_run_id }}
          BMW_RUN_ID: ${{ inputs.bmw_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          $catalog = Get-Content -LiteralPath 'catalog\catalog.json' -Raw | ConvertFrom-Json
          $runIds = @{ mercedes = [string]$env:MERCEDES_RUN_ID; bmw = [string]$env:BMW_RUN_ID }
          foreach ($brand in @($catalog.brands)) {
            $id = [string]$brand.id
            $releases = @()
            foreach ($release in @($brand.releases)) {
              if ($release -and -not [string]::IsNullOrWhiteSpace([string]$release.tag)) { $releases += $release }
            }
            if ($releases.Count -eq 0) {
              Write-Output "NOT RUN ${id}: no pinned release, artifact not downloaded"
              continue
            }
            if ($releases.Count -ne 1) { throw "$id has $($releases.Count) pinned releases. This workflow downloads one artifact per brand." }
            $tag = [string]$releases[0].tag
            $runId = [string]$runIds[$id]
            if ([string]::IsNullOrWhiteSpace($runId)) { throw "catalog pins $tag but no run id was provided for $id" }
            $api = "repos/$env:GITHUB_REPOSITORY/actions/runs/$runId/artifacts"
            $previousEap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            $listedText = (& gh api $api 2>&1 | Out-String)
            $listedExit = $LASTEXITCODE
            $ErrorActionPreference = $previousEap
            if ($listedExit -ne 0) { throw "gh api failed for run $runId (exit $listedExit). $listedText" }
            $listed = $listedText | ConvertFrom-Json
            $match = @()
            foreach ($artifact in @($listed.artifacts)) {
              if ($artifact -and [string]$artifact.name -eq $tag) { $match += $artifact }
            }
            if ($match.Count -eq 0) { throw "run $runId has no artifact named $tag" }
            foreach ($artifact in $match) {
              if ($artifact.expired) { throw "artifact $tag from run $runId is expired" }
            }
            $dir = Join-Path 'offline' $tag
            New-Item -ItemType Directory -Force -Path $dir | Out-Null
            $ErrorActionPreference = 'Continue'
            $downloadText = (& gh run download $runId --repo $env:GITHUB_REPOSITORY --name $tag --dir $dir 2>&1 | Out-String)
            $downloadExit = $LASTEXITCODE
            $ErrorActionPreference = 'Stop'
            if ($downloadExit -ne 0) { throw "gh run download failed for $tag (exit $downloadExit). $downloadText" }
            foreach ($name in @('workstation.zip', 'update-manifest.json')) {
              $path = Join-Path $dir $name
              if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "Missing $path" }
              Write-Output "staged $path from run $runId"
            }
          }

      - name: Run offline install test
        shell: powershell
        env:
          CATALOG_REF: ${{ inputs.catalog_ref }}
          MERCEDES_RUN_ID: ${{ inputs.mercedes_run_id }}
          BMW_RUN_ID: ${{ inputs.bmw_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path 'vm-install-test-output' | Out-Null
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -STA -ExecutionPolicy Bypass -File 'vm-harness\scripts\Invoke-VmInstallTest.ps1' -RepoRoot (Get-Location).Path -ReportDir (Join-Path (Get-Location).Path 'vm-install-test-output') -CatalogRef $env:CATALOG_REF -MercedesRunId $env:MERCEDES_RUN_ID -BmwRunId $env:BMW_RUN_ID
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer logs and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-install-test
          if-no-files-found: warn
          path: vm-install-test-output/**
